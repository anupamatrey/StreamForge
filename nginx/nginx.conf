worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 30s;

    client_max_body_size 1m;
    client_body_timeout   10s;
    client_header_timeout 10s;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types application/json text/plain;

    # Per-client-IP rate limit and connection cap.
    limit_req_zone  $binary_remote_addr zone=api_rl:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=search_cache:10m
                     max_size=50m inactive=5m use_temp_path=off;

    # The Spring Boot app runs on the Windows host (.\gradlew bootRun, port 8081).
    upstream streamforge_api {
        server host.docker.internal:8081 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Expose only the natural-language POST endpoint from the write-method surface.
        location = /api/customers/ai-search {
            limit_except POST { deny all; }
            limit_req  zone=api_rl burst=5 nodelay;
            limit_conn api_conn 10;

            proxy_pass http://streamforge_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout    90s;
            proxy_send_timeout    15s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Other customer API routes are read-only and may be cached briefly.
        location /api/customers {
            limit_except GET HEAD { deny all; }
            limit_req  zone=api_rl burst=20 nodelay;
            limit_conn api_conn 20;

            proxy_pass http://streamforge_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout    15s;
            proxy_send_timeout    15s;

            # Short cache smooths repeated searches; data is at most seconds stale.
            proxy_cache search_cache;
            proxy_cache_valid 200 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_502 http_503 http_504;

            # add_header in a location replaces inherited ones, so all are set here.
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location / {
            return 404;
        }
    }
}
